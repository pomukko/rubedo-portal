<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 背景: RUBEDOダーク -->
  <rect width="64" height="64" fill="#040406" rx="10"/>
  
  <defs>
    <!-- エミッション（赤発光）フィルター -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 中心からの赤色グラデーションオーラ -->
  <circle cx="32" cy="32" r="26" fill="#8f121d" opacity="0.35" filter="url(#glow)"/>

  <!-- 45度回転した外枠の菱形フレーム（拡大＆ライン強調） -->
  <rect x="16" y="16" width="32" height="32" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.8" transform="rotate(45 32 32)"/>

  <!-- 中心のコアスクエア（拡大＆輝き補正） -->
  <rect x="18" y="18" width="28" height="28" fill="#8f121d" filter="url(#glow)"/>
  <rect x="18" y="18" width="28" height="28" fill="#8f121d"/>
</svg>
