<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 背景: RUBEDOダーク -->
  <rect width="64" height="64" fill="#040406" rx="12"/>
  
  <defs>
    <!-- エミッション（赤発光）フィルター -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 中心からの赤色グラデーションオーラ -->
  <circle cx="32" cy="32" r="22" fill="#8f121d" opacity="0.3" filter="url(#glow)"/>

  <!-- 45度回転した外枠の菱形フレーム (scale-150 rotate-45 の再現) -->
  <rect x="20" y="20" width="24" height="24" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" transform="rotate(45 32 32)"/>

  <!-- 中心のコアスクエア -->
  <rect x="22" y="22" width="20" height="20" fill="#8f121d" filter="url(#glow)"/>
  <rect x="22" y="22" width="20" height="20" fill="#8f121d"/>
</svg>
